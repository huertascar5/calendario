<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Horario por Ciclos — Liceo Taller San Miguel</title>
<style>
  :root{
    --red: #b3272d;
    --red-dark: #8f1f24;
    --cream: #f4f1ec;
    --ink: #26221f;
    --gray: #8c8a86;
    --gray-light: #e4e1da;
    --lunch-blue: #2d6b8f;
    --gold: #d9a441;
    --uniform-gray: #6f7478;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:0 0 48px 0;
  }
  header{
    padding:28px 20px 20px 20px;
    background:#fff;
    border-bottom:3px solid var(--red);
  }
  .header-grid{
    display:grid;
    grid-template-columns:auto 1fr;
    row-gap:8px;
    align-items:center;
  }
  .header-grid .brand-logo{
    height:58px;
    width:auto;
    display:block;
    justify-self:center;
  }
  .header-grid .settings-btn{
    justify-self:end;
  }
  .header-grid h1{
    justify-self:start;
  }
  .header-grid .student-name{
    justify-self:end;
    font-size:14px;
    font-weight:700;
    color:var(--uniform-gray);
    text-align:right;
  }
  h1{
    font-family: Georgia, 'Times New Roman', serif;
    font-size:34px;
    font-weight:700;
    color:var(--red);
    margin:0;
    letter-spacing:-0.01em;
  }
  .sub{
    font-size:13px;
    color:var(--gray);
    font-weight:500;
    margin-top:4px;
  }
  .week-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 20px;
    background:#fff;
    border-bottom:1px solid var(--gray-light);
  }
  .week-nav button{
    border:none;
    background:var(--gray-light);
    color:var(--ink);
    width:34px;height:34px;
    border-radius:50%;
    font-size:16px;
    cursor:pointer;
  }
  .week-nav button:active{background:var(--red);color:#fff;}
  .week-label{
    font-size:13px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--ink);
    text-align:center;
  }
  .week-nav button.today-btn{
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:#fff;
    background:var(--red);
    border:none;
    cursor:pointer;
    display:block;
    width:auto;
    height:auto;
    margin:4px auto 0 auto;
    padding:6px 18px;
    border-radius:20px;
  }
  .week-nav button.today-btn:active{background:var(--red-dark);color:#fff;}
  main{padding:18px 16px 0 16px;}
  .days{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .day-card{
    background:#fff;
    border:1px solid var(--gray-light);
    border-left:6px solid var(--uniform-gray);
    border-radius:10px;
    padding:14px 16px;
    cursor:pointer;
    transition:box-shadow .15s ease, transform .1s ease;
  }
  .day-card:active{transform:scale(0.99);}
  .day-card.uniform-rojo{
    border-left-color:var(--red);
  }
  .day-card.uniform-gris{
    border-left-color:var(--uniform-gray);
  }
  .day-card.today{
    box-shadow:0 2px 10px rgba(179,39,45,0.12);
    background:#fffdf7;
  }
  .day-card.special{
    border-left-color:var(--gray);
  }
  .day-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .day-name-block{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .weekday{
    font-family: Georgia, 'Times New Roman', serif;
    font-size:19px;
    font-weight:700;
    color:var(--ink);
  }
  .date-num{
    font-size:13px;
    color:var(--gray);
    font-weight:600;
  }
  .cycle-tag{
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--red);
    background:#fbe9e8;
    padding:4px 9px;
    border-radius:20px;
    white-space:nowrap;
  }
  .cycle-tag.special{
    color:var(--gray);
    background:var(--gray-light);
  }
  .today-pill{
    font-size:10px;
    font-weight:700;
    color:#fff;
    background:var(--gray);
    padding:2px 8px;
    border-radius:20px;
    text-transform:uppercase;
    letter-spacing:.04em;
    margin-left:8px;
  }
  .day-card.uniform-rojo .today-pill{ background:var(--red); }
  .day-card.uniform-gris .today-pill{ background:var(--uniform-gray); }
  .chevron{
    color:var(--gray);
    font-size:18px;
    margin-left:6px;
  }
  footer{
    padding:20px 20px 0 20px;
    text-align:center;
    font-size:11px;
    color:var(--gray);
  }

  /* Modal */
  .overlay{
    position:fixed;inset:0;
    background:rgba(38,34,31,0.45);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:50;
  }
  .overlay.show{display:flex;}
  .sheet{
    background:#fff;
    width:100%;
    max-width:640px;
    border-radius:18px 18px 0 0;
    padding:0 0 24px 0;
    max-height:85vh;
    overflow-y:auto;
    animation:slideup .22s ease;
  }
  @keyframes slideup{
    from{transform:translateY(24px);opacity:0;}
    to{transform:translateY(0);opacity:1;}
  }
  .sheet-header{
    position:sticky;top:0;
    background:var(--red);
    color:#fff;
    padding:20px 20px 16px 20px;
    border-radius:18px 18px 0 0;
  }
  .sheet-header .grip{
    width:36px;height:4px;background:rgba(255,255,255,.4);
    border-radius:4px;margin:0 auto 14px auto;
  }
  .sheet-header .title-row{
    display:flex;justify-content:space-between;align-items:flex-start;
  }
  .sheet-header h2{
    font-family: Georgia, 'Times New Roman', serif;
    margin:0;font-size:24px;
  }
  .sheet-header .sheet-sub{
    font-size:12px;opacity:.85;margin-top:4px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;
  }
  .close-btn{
    background:rgba(255,255,255,.18);
    border:none;color:#fff;
    width:30px;height:30px;border-radius:50%;
    font-size:16px;cursor:pointer;
    flex-shrink:0;
  }
  .subjects{
    padding:8px 20px 0 20px;
  }
  .subj-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 4px;
    border-bottom:1px solid var(--gray-light);
  }
  .subj-row:last-child{border-bottom:none;}
  .subj-idx{
    font-size:11px;
    color:#fff;
    background:var(--ink);
    width:22px;height:22px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    font-weight:700;
  }
  .subj-name{
    font-size:15px;
    font-weight:600;
    flex:1;
  }
  .subj-row.break .subj-name, .subj-row.lunch .subj-name{
    text-transform:uppercase;
    font-size:12.5px;
    letter-spacing:.05em;
    color:var(--red);
  }
  .subj-row.break, .subj-row.lunch{
    background:#fbeceb;
  }
  .subj-row.break .subj-idx, .subj-row.lunch .subj-idx{
    display:none;
  }
  .no-data{
    padding:30px 20px;
    text-align:center;
    color:var(--gray);
    font-size:14px;
  }

  /* Footer de evento destacado en el detalle del día */
  .event-footer{
    display:flex;
    align-items:flex-start;
    gap:10px;
    margin:6px 20px 20px 20px;
    padding:12px 14px;
    background:#fbe9e8;
    border-left:4px solid var(--red);
    border-radius:8px;
  }
  .event-footer-icon{
    color:var(--red);
    font-size:14px;
    line-height:1.4;
    flex-shrink:0;
  }
  .event-footer-text{
    font-size:13.5px;
    font-weight:600;
    color:var(--red-dark);
    line-height:1.4;
  }

  /* Uniforme (solo texto) */
  .sheet-header .title-row{
    align-items:center;
  }
  .mascot-wrap{
    flex-shrink:0;
    margin-left:10px;
  }
  .uniform-tag{
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:#fff;
    background:rgba(255,255,255,0.22);
    padding:5px 11px;
    border-radius:20px;
    white-space:nowrap;
  }

  /* Curso badge en el título */
  .curso-badge{
    font-size:18px;
    font-weight:700;
    color:var(--red);
    background:#fbe9e8;
    padding:2px 10px;
    border-radius:8px;
    vertical-align:middle;
    margin-left:8px;
    display:none;
  }

  /* Botón de configuración */
  .settings-btn{
    width:34px;height:34px;
    border-radius:50%;
    border:none;
    background:var(--gray-light);
    color:var(--ink);
    font-size:17px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .settings-btn:active{background:var(--red);color:#fff;}

  /* Panel de configuración */
  .settings-body{
    padding:18px 20px 28px 20px;
  }
  .field-block{
    margin-bottom:22px;
  }
  .field-label{
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--gray);
    margin-bottom:8px;
    display:block;
  }
  .field-help{
    font-size:12px;
    color:var(--gray);
    margin-top:6px;
  }
  .text-input{
    width:100%;
    font-size:16px;
    padding:10px 12px;
    border:1px solid var(--gray-light);
    border-radius:8px;
    color:var(--ink);
    font-family:inherit;
  }
  .text-input:focus{outline:2px solid var(--red);outline-offset:1px;}
  .inline-form{
    display:flex;
    gap:10px;
    align-items:flex-start;
  }
  .inline-form .text-input{flex:1;}
  .action-btn{
    background:var(--red);
    color:#fff;
    border:none;
    font-size:13px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.03em;
    padding:10px 16px;
    border-radius:8px;
    cursor:pointer;
    white-space:nowrap;
  }
  .action-btn:active{background:var(--red-dark);}
  .action-btn.full{width:100%;margin-top:14px;}
  .status-msg{
    font-size:12px;
    font-weight:600;
    margin-top:8px;
  }
  .status-msg.error{color:var(--red);}
  .status-msg.success{color:#2c7a3d;}
  .day-pills{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:16px;
  }
  .day-pill{
    font-size:12px;
    font-weight:700;
    padding:6px 13px;
    border-radius:20px;
    border:1px solid var(--gray-light);
    background:#fff;
    color:var(--ink);
    cursor:pointer;
  }
  .day-pill.active{
    background:var(--red);
    border-color:var(--red);
    color:#fff;
  }
  .subject-edit-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:8px;
  }
  .subject-edit-row .subj-num{
    width:20px;
    font-size:12px;
    color:var(--gray);
    font-weight:700;
    flex-shrink:0;
    text-align:center;
  }
  .subject-edit-row input{
    flex:1;
    font-size:14px;
    padding:8px 10px;
    border:1px solid var(--gray-light);
    border-radius:7px;
    font-family:inherit;
  }
  .subject-edit-row.fixed input{
    background:#f7f6f3;
    color:var(--gray);
    font-style:italic;
  }

  /* Editor de uniforme por día */
  .uniform-config-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:9px 0;
    border-bottom:1px solid var(--gray-light);
  }
  .uniform-config-row:last-child{border-bottom:none;}
  .uniform-config-row .uc-day-label{
    font-size:14px;
    font-weight:600;
    color:var(--ink);
  }
  .uniform-toggle{
    display:flex;
    gap:6px;
  }
  .uniform-toggle button{
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.03em;
    padding:6px 13px;
    border-radius:20px;
    border:1px solid var(--gray-light);
    background:#fff;
    color:var(--ink);
    cursor:pointer;
  }
  .uniform-toggle button.active-gris{
    background:var(--uniform-gray);
    border-color:var(--uniform-gray);
    color:#fff;
  }
  .uniform-toggle button.active-rojo{
    background:var(--red);
    border-color:var(--red);
    color:#fff;
  }

  /* Secciones delimitadas del panel de configuración */
  .settings-section{
    border:1px solid var(--gray-light);
    border-radius:12px;
    padding:18px 16px;
    margin-bottom:16px;
    background:#fcfbf9;
  }
  .settings-section:last-child{margin-bottom:0;}
  .section-title{
    display:flex;
    align-items:center;
    gap:9px;
    font-size:13px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--ink);
    margin-bottom:16px;
  }
  .section-num{
    width:20px;height:20px;
    border-radius:50%;
    background:var(--red);
    color:#fff;
    font-size:11px;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
</style>
</head>

// ---------- Almacenamiento persistente (localStorage con respaldo en memoria) ----------
const STORAGE_KEY_CURSO = 'sm_horario_curso';
const STORAGE_KEY_ESTUDIANTE = 'sm_horario_estudiante';
const STORAGE_KEY_SUBJECTS = 'sm_horario_subjects';
let memoryStore = {};
function storageGet(key){
  try{ return localStorage.getItem(key); }
  catch(e){ return memoryStore[key] !== undefined ? memoryStore[key] : null; }
}
function storageSet(key, value){
  try{ localStorage.setItem(key, value); }
  catch(e){ memoryStore[key] = value; }
}

// Estado efectivo de asignaturas: por defecto + lo que el usuario haya editado
let SUBJECTS = JSON.parse(JSON.stringify(DEFAULT_SUBJECTS));
(function loadSubjectsFromStorage(){
  const saved = storageGet(STORAGE_KEY_SUBJECTS);
  if(saved){
    try{
      const parsed = JSON.parse(saved);
      Object.keys(parsed).forEach(day=>{ SUBJECTS[day] = parsed[day]; });
    }catch(e){ /* ignora datos corruptos */ }
  }
})();

// Uniforme según el día del ciclo: valor por defecto (rojo en 3 y 5, gris el resto)
const STORAGE_KEY_UNIFORMS = 'sm_horario_uniforms';
const UNIFORM_BY_DAY = { 1:"gris", 2:"gris", 3:"rojo", 4:"gris", 5:"rojo", 6:"gris" };
(function loadUniformsFromStorage(){
  const saved = storageGet(STORAGE_KEY_UNIFORMS);
  if(saved){
    try{
      const parsed = JSON.parse(saved);
      Object.keys(parsed).forEach(day=>{
        if(parsed[day]==='gris' || parsed[day]==='rojo'){ UNIFORM_BY_DAY[day] = parsed[day]; }
      });
    }catch(e){ /* ignora datos corruptos */ }
  }
})();
const WEEKDAY_NAMES = ["Lunes","Martes","Miércoles","Jueves","Viernes"];
const MONTH_NAMES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];

function toKey(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function getMonday(d){
  const date = new Date(d);
  const dow = date.getDay(); // 0 Sun ... 6 Sat
  const diff = dow===0 ? -6 : 1-dow;
  date.setDate(date.getDate()+diff);
  date.setHours(0,0,0,0);
  return date;
}

let currentMonday = getMonday(new Date());
const todayKey = toKey(new Date());

function render(){
  const container = document.getElementById('daysContainer');
  container.innerHTML = '';

  const startLabel = currentMonday;
  const endLabel = new Date(currentMonday); endLabel.setDate(endLabel.getDate()+4);
  document.getElementById('weekLabel').textContent =
    `${startLabel.getDate()} ${MONTH_NAMES[startLabel.getMonth()]} – ${endLabel.getDate()} ${MONTH_NAMES[endLabel.getMonth()]} ${endLabel.getFullYear()}`;

  for(let i=0;i<5;i++){
    const d = new Date(currentMonday);
    d.setDate(d.getDate()+i);
    const key = toKey(d);
    const info = CYCLE_MAP[key];
    const isToday = key===todayKey;

    const card = document.createElement('div');
    let uniformClass = '';
    if(info && info.day){
      uniformClass = ' uniform-' + UNIFORM_BY_DAY[info.day];
    }
    card.className = 'day-card' + (isToday?' today':'') + (info && info.special ? ' special':'') + uniformClass;

    let tagHtml, subLabel;
    if(info && info.day){
      tagHtml = `<span class="cycle-tag">Ciclo ${info.cycle} · Día ${info.day}</span>`;
    } else if(info && info.special){
      tagHtml = `<span class="cycle-tag special">${info.special}</span>`;
    } else {
      tagHtml = `<span class="cycle-tag special">Sin datos</span>`;
    }

    card.innerHTML = `
      <div class="day-top">
        <div class="day-name-block">
          <span class="weekday">${WEEKDAY_NAMES[i]}</span>
          <span class="date-num">${d.getDate()} ${MONTH_NAMES[d.getMonth()]}</span>
          ${isToday ? '<span class="today-pill">HOY</span>' : ''}
        </div>
        <div style="display:flex;align-items:center;">
          ${tagHtml}
          <span class="chevron">›</span>
        </div>
      </div>
      ${info && info.event ? `<div style="margin-top:8px;font-size:12px;color:var(--red);font-weight:600;">${info.event}</div>` : ''}
    `;

    card.addEventListener('click', ()=>openSheet(d, info, WEEKDAY_NAMES[i]));
    container.appendChild(card);
  }
}

function openSheet(date, info, weekdayName){
  const overlay = document.getElementById('overlay');
  const title = document.getElementById('sheetTitle');
  const sub = document.getElementById('sheetSub');
  const list = document.getElementById('subjectsList');
  const eventFooter = document.getElementById('eventFooter');
  const eventFooterText = document.getElementById('eventFooterText');

  title.textContent = `${weekdayName} ${date.getDate()} de ${MONTH_NAMES[date.getMonth()]}`;

  const mascotWrap = document.getElementById('mascotWrap');
  const uniformTag = document.getElementById('uniformTag');

  list.innerHTML = '';
  eventFooter.style.display = 'none';

  if(info && info.day){
    sub.textContent = `Ciclo ${info.cycle} · Día ${info.day}`;
    const uniform = UNIFORM_BY_DAY[info.day];
    uniformTag.textContent = `Uniforme ${uniform}`;
    mascotWrap.style.display = 'block';
    SUBJECTS[info.day].forEach((subj, idx)=>{
      const row = document.createElement('div');
      const cls = subj==='BREAK' ? 'break' : (subj==='LUNCH' ? 'lunch' : '');
      row.className = 'subj-row ' + cls;
      row.innerHTML = `<div class="subj-idx">${idx+1}</div><div class="subj-name">${subj==='BREAK'?'Descanso':subj==='LUNCH'?'Almuerzo':subj}</div>`;
      list.appendChild(row);
    });
    if(info.event){
      eventFooterText.textContent = info.event;
      eventFooter.style.display = 'flex';
    }
  } else if(info && info.special){
    sub.textContent = info.special;
    mascotWrap.style.display = 'none';
    list.innerHTML = `<div class="no-data">No hay asignaturas programadas para este día.</div>`;
  } else {
    sub.textContent = 'Sin información';
    mascotWrap.style.display = 'none';
    list.innerHTML = `<div class="no-data">Este día está fuera del rango del calendario cargado (julio 2026 – agosto 2027).</div>`;
  }

  overlay.classList.add('show');
}

document.getElementById('closeBtn').addEventListener('click', ()=>{
  document.getElementById('overlay').classList.remove('show');
});
document.getElementById('overlay').addEventListener('click', (e)=>{
  if(e.target.id==='overlay') e.target.classList.remove('show');
});
document.getElementById('prevWeek').addEventListener('click', ()=>{
  currentMonday.setDate(currentMonday.getDate()-7);
  render();
});
document.getElementById('nextWeek').addEventListener('click', ()=>{
  currentMonday.setDate(currentMonday.getDate()+7);
  render();
});
document.getElementById('goToday').addEventListener('click', ()=>{
  currentMonday = getMonday(new Date());
  render();
});

// ---------- Panel de configuración ----------
const SUBJECT_LABELS = ["1ª clase","2ª clase","Descanso","3ª clase","4ª clase","5ª clase","Almuerzo","6ª clase","7ª clase"];
const FIXED_INDEXES = [2, 6]; // BREAK y LUNCH: posiciones fijas, no editables
let selectedEditDay = 1;
let draftSubjects = null;
let draftUniforms = null;

function loadCursoBadge(){
  const curso = storageGet(STORAGE_KEY_CURSO);
  const badge = document.getElementById('cursoBadge');
  if(curso){
    badge.textContent = curso;
    badge.style.display = 'inline-block';
  } else {
    badge.style.display = 'none';
  }
}

function loadStudentNameDisplay(){
  const nombre = storageGet(STORAGE_KEY_ESTUDIANTE);
  document.getElementById('studentNameDisplay').textContent = nombre || '';
}

function renderUniformEditor(){
  const wrap = document.getElementById('uniformEditor');
  wrap.innerHTML = '';
  for(let d=1; d<=6; d++){
    const row = document.createElement('div');
    row.className = 'uniform-config-row';

    const label = document.createElement('div');
    label.className = 'uc-day-label';
    label.textContent = 'Día ' + d;

    const toggle = document.createElement('div');
    toggle.className = 'uniform-toggle';

    const btnGris = document.createElement('button');
    btnGris.type = 'button';
    btnGris.textContent = 'Uniforme gris';
    const btnRojo = document.createElement('button');
    btnRojo.type = 'button';
    btnRojo.textContent = 'Uniforme rojo';

    function refreshActive(){
      btnGris.className = draftUniforms[d]==='gris' ? 'active-gris' : '';
      btnRojo.className = draftUniforms[d]==='rojo' ? 'active-rojo' : '';
    }
    refreshActive();

    btnGris.addEventListener('click', ()=>{ draftUniforms[d] = 'gris'; refreshActive(); });
    btnRojo.addEventListener('click', ()=>{ draftUniforms[d] = 'rojo'; refreshActive(); });

    toggle.appendChild(btnGris);
    toggle.appendChild(btnRojo);
    row.appendChild(label);
    row.appendChild(toggle);
    wrap.appendChild(row);
  }
}

function renderDayPills(){
  const wrap = document.getElementById('dayPills');
  wrap.innerHTML = '';
  for(let d=1; d<=6; d++){
    const pill = document.createElement('button');
    pill.type = 'button';
    pill.className = 'day-pill' + (d===selectedEditDay ? ' active' : '');
    pill.textContent = 'Día ' + d;
    pill.addEventListener('click', ()=>{
      saveCurrentEditorIntoDraft();
      selectedEditDay = d;
      renderDayPills();
      renderSubjectsEditor();
    });
    wrap.appendChild(pill);
  }
}

function renderSubjectsEditor(){
  const wrap = document.getElementById('subjectsEditor');
  wrap.innerHTML = '';
  const list = draftSubjects[selectedEditDay];
  list.forEach((subj, idx)=>{
    const row = document.createElement('div');
    const isFixed = FIXED_INDEXES.includes(idx);
    row.className = 'subject-edit-row' + (isFixed ? ' fixed' : '');
    const label = document.createElement('div');
    label.className = 'subj-num';
    label.textContent = idx+1;
    const input = document.createElement('input');
    input.type = 'text';
    input.dataset.idx = idx;
    if(isFixed){
      input.value = subj === 'BREAK' ? 'Descanso (fijo)' : 'Almuerzo (fijo)';
      input.disabled = true;
    } else {
      input.value = subj;
    }
    row.appendChild(label);
    row.appendChild(input);
    wrap.appendChild(row);
  });
}

function saveCurrentEditorIntoDraft(){
  const wrap = document.getElementById('subjectsEditor');
  const inputs = wrap.querySelectorAll('input');
  inputs.forEach(input=>{
    const idx = parseInt(input.dataset.idx, 10);
    if(!FIXED_INDEXES.includes(idx)){
      draftSubjects[selectedEditDay][idx] = input.value.trim() || draftSubjects[selectedEditDay][idx];
    }
  });
}

document.getElementById('settingsBtn').addEventListener('click', ()=>{
  document.getElementById('estudianteInput').value = storageGet(STORAGE_KEY_ESTUDIANTE) || '';
  document.getElementById('cursoInput').value = storageGet(STORAGE_KEY_CURSO) || '';
  document.getElementById('studentStatus').textContent = '';
  document.getElementById('subjectsStatus').textContent = '';
  document.getElementById('uniformsStatus').textContent = '';
  draftSubjects = JSON.parse(JSON.stringify(SUBJECTS));
  draftUniforms = JSON.parse(JSON.stringify(UNIFORM_BY_DAY));
  selectedEditDay = 1;
  renderUniformEditor();
  renderDayPills();
  renderSubjectsEditor();
  document.getElementById('settingsOverlay').classList.add('show');
});
document.getElementById('settingsCloseBtn').addEventListener('click', ()=>{
  document.getElementById('settingsOverlay').classList.remove('show');
});
document.getElementById('settingsOverlay').addEventListener('click', (e)=>{
  if(e.target.id==='settingsOverlay') e.target.classList.remove('show');
});

document.getElementById('saveStudentBtn').addEventListener('click', ()=>{
  const estudianteInput = document.getElementById('estudianteInput');
  const cursoInput = document.getElementById('cursoInput');
  const status = document.getElementById('studentStatus');
  const cursoValue = cursoInput.value.trim().toUpperCase();

  if(cursoValue !== '' && !/^[0-9]{1,2}[A-Z]$/.test(cursoValue)){
    status.className = 'status-msg error';
    status.textContent = 'Curso inválido. Usa máximo 2 números y 1 letra (ej: 6A).';
    return;
  }

  storageSet(STORAGE_KEY_ESTUDIANTE, estudianteInput.value.trim());
  storageSet(STORAGE_KEY_CURSO, cursoValue);
  loadCursoBadge();
  loadStudentNameDisplay();
  status.className = 'status-msg success';
  status.textContent = 'Guardado ✓';
});

document.getElementById('saveUniformsBtn').addEventListener('click', ()=>{
  Object.assign(UNIFORM_BY_DAY, draftUniforms);
  storageSet(STORAGE_KEY_UNIFORMS, JSON.stringify(UNIFORM_BY_DAY));
  render();
  const status = document.getElementById('uniformsStatus');
  status.className = 'status-msg success';
  status.textContent = 'Uniformes guardados ✓';
});

document.getElementById('saveSubjectsBtn').addEventListener('click', ()=>{
  saveCurrentEditorIntoDraft();
  SUBJECTS = JSON.parse(JSON.stringify(draftSubjects));
  storageSet(STORAGE_KEY_SUBJECTS, JSON.stringify(SUBJECTS));
  const status = document.getElementById('subjectsStatus');
  status.className = 'status-msg success';
  status.textContent = 'Asignaturas guardadas ✓';
});

loadCursoBadge();
loadStudentNameDisplay();
render();

</script>
